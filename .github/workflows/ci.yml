name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zipzap
          POSTGRES_PASSWORD: zipzap
          POSTGRES_DB: zipzap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zipzap -d zipzap"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      # Testy integracyjne tworzą i migrują tę bazę przy pierwszym starcie.
      ZIPZAP_TEST_POSTGRES: "Host=localhost;Port=5432;Database=zipzap_it;Username=zipzap;Password=zipzap"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/ZipZap.sln
      - name: Build
        run: dotnet build backend/ZipZap.sln -c Release --no-restore
      - name: Test
        run: dotnet test backend/ZipZap.sln -c Release --no-build --verbosity normal

  mobile:
    name: Mobile (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
