services:
  postgres:
    image: postgres:16-alpine
    container_name: zipzap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zipzap}
      POSTGRES_USER: ${POSTGRES_USER:-zipzap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zipzap}
    ports:
      - "5432:5432"
    volumes:
      - zipzap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipzap} -d ${POSTGRES_DB:-zipzap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zipzap-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zipzap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zipzap}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # panel zarządzania
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zipzap-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-zipzap};Username=${POSTGRES_USER:-zipzap};Password=${POSTGRES_PASSWORD:-zipzap}"
      Jwt__SigningKey: ${JWT__SIGNINGKEY:-CHANGE_ME_DEV_ONLY_super_secret_key_at_least_32_chars_long}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-zipzap}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-zipzap}
      Payments__Provider: ${PAYMENTS__PROVIDER:-mock}
      Payments__Mock__Secret: ${PAYMENTS__MOCK__SECRET:-mock-dev-secret}
      Payments__PublicUrl: ${PAYMENTS__PUBLICURL:-http://localhost:4200}
      Identity__PublicUrl: ${IDENTITY__PUBLICURL:-http://localhost:4200}
      Google__ClientId: ${GOOGLE__CLIENTID:-}
      Seed__AdminEmail: ${SEED__ADMINEMAIL:-admin@zipzap.local}
      Seed__AdminPassword: ${SEED__ADMINPASSWORD:-Admin123!}
    ports:
      - "5080:8080"

  # PWA klienta (Flutter web) za nginx. Profil "web" — nie buduje się domyślnie
  # (build Fluttera jest wolny). Uruchom: docker compose --profile web up -d --build web
  web:
    build:
      context: ./mobile
      dockerfile: web.Dockerfile
      args:
        API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:5080/api}
    container_name: zipzap-web
    profiles: ["web"]
    ports:
      - "8090:80"

volumes:
  zipzap-pgdata:
