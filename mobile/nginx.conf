server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf;

    # Pliki sterujące — bez cache, żeby aktualizacja wchodziła natychmiast.
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json         { add_header Cache-Control "no-cache"; }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Poprawny MIME dla WebAssembly (CanvasKit/skwasm).
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
    }

    # SPA / deep-linki → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
}
