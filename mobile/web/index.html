<!DOCTYPE html>
<html lang="pl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dowózka.pl — zamów zakupy i jedzenie z lokalnych sklepów i restauracji.">
  <meta name="theme-color" content="#14B9BA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dowózka.pl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dowózka.pl</title>
  <link rel="manifest" href="manifest.json">

  <!-- Lekki ekran ładowania: widoczny od razu po zeskanowaniu kodu QR, zanim pobierze się aplikacja. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3A3F4B; text-align: center; padding: 24px; }
    #app-loading .brand { font-size: 26px; font-weight: 800; color: #0E9A9B; letter-spacing: -0.5px; }
    #app-loading .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #D5F1F1;
      border-top-color: #14B9BA; animation: zzspin .9s linear infinite; }
    #app-loading .msg { font-size: 15px; color: #6B7280; max-width: 22em; line-height: 1.45; }
    #app-loading button { display: none; font: inherit; font-weight: 600; color: #fff; background: #14B9BA;
      border: 0; border-radius: 10px; padding: 10px 18px; }
    #app-loading.slow button { display: inline-block; }
    @keyframes zzspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #app-loading .spin { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="brand">Dowózka.pl</div>
    <div class="spin" aria-hidden="true"></div>
    <div class="msg" id="app-loading-msg">Ładowanie oferty…</div>
    <button type="button" onclick="location.reload()">Odśwież stronę</button>
  </div>
  <noscript>
    <p style="font-family:system-ui,sans-serif;text-align:center;padding:24px">
      Dowózka.pl potrzebuje włączonej obsługi JavaScript w przeglądarce.
    </p>
  </noscript>
  <script>
    // Wolne łącze albo przerwane pobieranie — zamiast wiecznego kręciołka pokaż, co można zrobić.
    setTimeout(function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.className = 'slow';
      document.getElementById('app-loading-msg').textContent =
        'Ładowanie trwa dłużej niż zwykle — sprawdź połączenie z internetem albo odśwież stronę.';
    }, 20000);
  </script>

  <!-- Start aplikacji: web/flutter_bootstrap.js (usuwa ekran ładowania po uruchomieniu). -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Rejestracja własnego service workera (instalowalność PWA + offline powłoki). -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW registration failed', e);
        });
      });
    }
  </script>
</body>
</html>
